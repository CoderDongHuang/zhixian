name: Production data retention

on:
  # Daily production automation remains paused. Restore only after the billing/runbook gate.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Count eligible rows without deleting them
        required: true
        type: boolean
        default: true

concurrency:
  group: production-data-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CLEANUP_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:cleanup
