name: Mobile release build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        type: choice
        options: [android, ios, all]
      profile:
        description: EAS profile
        required: true
        type: choice
        options: [preview, production, preview-simulator]

concurrency:
  group: mobile-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://zhixian.asia
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android' && inputs.profile == 'preview'
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release readiness
        run: npm run release:check
      - run: npm run typecheck --workspace mobile-app
      - run: npm test --workspace mobile-app
      - name: Build other distribution formats
        if: inputs.platform != 'android' || inputs.profile != 'preview'
        run: npx eas-cli@25.2.0 build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --no-wait
        working-directory: mobile-app
      - name: Build and wait for the signed Android preview APK
        if: inputs.platform == 'android' && inputs.profile == 'preview'
        working-directory: mobile-app
        run: npx eas-cli@25.2.0 build --platform android --profile preview --non-interactive --wait --json > ../eas-android-build.json
      - name: Download and verify APK, collect actual package metadata
        if: inputs.platform == 'android' && inputs.profile == 'preview'
        shell: bash
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          AAPT="$tools/aapt" APKSIGNER="$tools/apksigner" node scripts/android-preview-artifact.mjs eas-android-build.json android-preview
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'android' && inputs.profile == 'preview'
        with:
          name: android-preview-${{ github.sha }}
          path: android-preview/
          retention-days: 30
          if-no-files-found: error
      - name: Record Android delivery status
        if: inputs.platform == 'android' && inputs.profile == 'preview'
        run: echo 'Signed preview APK and SHA-256 collected. Device acceptance remains pending; no public download has been published.' >> "$GITHUB_STEP_SUMMARY"
