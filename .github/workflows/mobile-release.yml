name: Mobile release build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        type: choice
        options: [android, ios, all]
      profile:
        description: EAS profile
        required: true
        type: choice
        options: [preview, production, preview-simulator]

concurrency:
  group: mobile-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://zhixian.asia
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace mobile-app
      - run: npm test --workspace mobile-app
      - run: npx eas-cli@latest build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --no-wait
        working-directory: mobile-app
