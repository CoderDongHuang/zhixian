name: Production monitor

on:
  # Scheduled production automation is paused. See README.md before restoring it.
  workflow_dispatch:

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/monitor-production.mjs
        env:
          MONITOR_URL: https://zhixian.asia
          MONITOR_THRESHOLD_MS: 5000
          MONITOR_SAMPLE_COUNT: 3
      - name: Send failure alert
        if: failure()
        run: |
          curl --fail-with-body -sS https://api.resend.com/emails \
            -H "Authorization: Bearer $EMAIL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Zhixian Monitor <$EMAIL_FROM>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"Zhixian production monitor failed\",\"text\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
        env:
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
