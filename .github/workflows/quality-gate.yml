name: V0.4 quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhixian_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zhixian_e2e
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/zhixian_e2e
      AUTH_SECRET: e2e-auth-secret-at-least-24-characters
      MINI_TOKEN_SECRET: e2e-mini-secret-at-least-24-characters
      WECHAT_APP_ID: wx-e2e
      WECHAT_APP_SECRET: e2e-secret
      E2E_TEST_MODE: "true"
      E2E_TEST_SECRET: e2e-local-secret
      APP_URL: http://127.0.0.1:3100
      CONTENT_PIPELINE_STATE: paused
      AI_BUDGET_ENFORCE: "false"
      AI_BUDGET_JSON: ""
      MONITOR_TOKEN: local-monitor-secret-at-least-24
      EMBEDDING_API_KEY: local-mock-only
      EMBEDDING_API_URL: http://127.0.0.1:3158
      EMBEDDING_MODEL: e2e-search
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run typecheck
        working-directory: mobile-app
      - run: npm test
        working-directory: mobile-app
      - run: npm run doctor
        working-directory: mobile-app
      - run: npx expo export --platform android --output-dir dist-ci
        working-directory: mobile-app
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:deploy
      - run: npm run db:generate
      - run: npm run test:db:prepare
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:auth-http
      - run: npm run test:operations:http
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
